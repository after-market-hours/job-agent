include_title_patterns:
  - chief of staff
  - \bcos\b
  - strategy (&|and) operations
  - strategy ?& ?ops
  - \bbiz ?ops\b
  - business operations
  - strategic operations
  - \bgtm\b
  - go[- ]to[- ]market
  - revenue operations
  - \brev ?ops\b
  - sales operations
  - growth operations
  - strategy (lead|manager|associate|analyst)
  - (operations|ops) (lead|manager|associate)
  - business (strategy|planning)
  # strategic finance
  - strategic finance
  - finance (&|and) (strategy|operations|ops)
  - (strategy|business|corporate) (&|and) finance
  - (corporate|business|growth|gtm|revenue|sales|commercial) finance
  - finance (lead|manager|associate|analyst|partner|business partner)
  - financial (analyst|modeling)
# Pure business-ops titles are dropped unless they also carry one of the keep terms (strategy, CoS, GTM, revenue/sales/
# marketing/growth ops, finance...). "Business Operations Manager" is dropped; "Strategy & Business Operations" is kept.
pure_ops_patterns:
  - \b(business|biz) ?ops\b
  - \bbizops\b
  - business operations
  - ^(senior |sr\.? )?(operations|ops)\b
  - \b(operations|ops) (lead|manager|associate|analyst|specialist|coordinator)
pure_ops_keep_patterns:
  - chief of staff
  - strateg
  - \bgtm\b
  - go[- ]to[- ]market
  - revenue
  - \brev ?ops\b
  - sales
  - growth
  - financ
  - founder
  - special projects
exclude_title_patterns:
  - \bmarketing\b
  - \bfp ?(&|and) ?a\b
  - \bfinancial planning\b
  - \b(accountant|accounting|controller|bookkeep\w*|tax|audit\w*|accounts (payable|receivable)|billing|treasury|procurement|payments? operations)\b
  - \b(senior|sr\.?) (director|vice)\b
  - \b(vp|vice president|head of|svp|evp|chief (?!of staff))\b
  - \b(engineer|developer|designer|scientist|attorney|counsel|accountant|nurse|recruiter)\b
  - \bintern(ship)?\b
  - \b(talent|recruit\w*|sourcer|staffing)\b
  - \b(warehouse|fulfillment|facilit(y|ies)|plant|store|retail operations|field operations|reinsurance|payroll|hr|legal|people operations|recruiting|trading|mining|site operations|customer support|contract)\b
max_age_days: 35           # postings older than this (or with no posted date) are dropped
ashby_bonus_days: 7        # an Ashby-hosted role ranks as if it were this many days newer
linkedin_unverified_limit: 8   # LinkedIn roles at companies whose funding stage can't be verified (separate section)
daily_limit: 30
max_lone_min_years: 5      # exclude if the lone minimum is >= 6 (or a range starts at 7+)
min_salary: 100000         # drop jobs whose listed pay (or top of range) is below this
locations: []              # e.g. ["united states", "remote"]; empty = no location filter
exclude_location_patterns:    # skip roles clearly outside the US
  - '\b(london|uk|united kingdom|dublin|ireland|berlin|germany|paris|france|belgrade|serbia|europe|emea|apac|india|bangalore|singapore|sydney|australia|toronto|canada|amsterdam|netherlands|lisbon|portugal|madrid|spain|tel aviv|israel|warsaw|poland|brazil|mexico|saudi|riyadh|dubai|uae|abu dhabi|qatar|gcc|middle east|africa|nigeria|kenya|lagos|vietnam|ho chi minh|manila|philippines|japan|tokyo|korea|seoul|hong kong|china|shanghai|bogota|colombia|argentina|buenos aires|chile|zurich|switzerland|stockholm|sweden|copenhagen|denmark|oslo|norway|helsinki|finland|vienna|austria|milan|italy|prague|romania|bucharest|ukraine|kyiv|turkey|istanbul|cairo|egypt)\b'
location_override_patterns:   # ...unless the location also says one of these
  - 'united states|\busa?\b|new york|san francisco|remote \(us|remote - us'
public_limit: 10
