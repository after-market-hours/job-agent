name: Weekly company-list refresh

on:
  schedule:
    - cron: "0 10 * * 0"   # Sundays 10:00 UTC
  workflow_dispatch: {}

concurrency:
  group: job-agent-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh YC list and VC directory / emerging-brand watchlist (company lists only; never applies anywhere)
        run: |
          mkdir -p logs data
          python -m jobagent harvest
          python -m jobagent watchlist
          python -m jobagent ashby
      - name: Save lists
        run: |
          git config user.name "job-agent-bot"
          git config user.email "job-agent-bot@users.noreply.github.com"
          git add data/*.json || true
          git diff --cached --quiet || (git commit -m "Refresh company lists" && git pull --rebase -q && git push -q)
