name: Daily job digest

on:
  schedule:
    - cron: "0 13 * * *"   # 13:00 UTC = 8:00am US Eastern (9:00am during daylight time)
  workflow_dispatch:
    inputs:
      no_save:
        description: "Test mode: send the email but do not mark jobs as seen"
        type: boolean
        default: true

concurrency:
  group: job-agent-data
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  digest:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Send digest
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          NO_SAVE: ${{ github.event_name == 'workflow_dispatch' && inputs.no_save }}
        run: |
          mkdir -p logs data
          if [ "$NO_SAVE" = "true" ]; then python -m jobagent digest --no-save; else python -m jobagent digest; fi
      - name: Save state (dedupe history, company caches)
        run: |
          git config user.name "job-agent-bot"
          git config user.email "job-agent-bot@users.noreply.github.com"
          git add data/jobs.db data/*.json || true
          git diff --cached --quiet || (git commit -m "Update digest state" && git pull --rebase -q && git push -q)
